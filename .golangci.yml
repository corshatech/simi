version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - gochecknoglobals
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - unconvert
  settings:
    goconst:
      min-len: 2
      min-occurrences: 3
    govet:
      enable:
        - fieldalignment
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/corshatech)
        - blank
        - dot
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
